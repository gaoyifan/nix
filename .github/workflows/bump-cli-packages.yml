name: Bump CLI Packages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to bump"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - antigravity-cli
          - codex
          - cursor-cli
      version:
        description: "Optional version, only when selecting a single package"
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: bump-cli-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Bump packages
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PACKAGE: ${{ github.event.inputs.package || 'all' }}
          REQUESTED_VERSION: ${{ github.event.inputs.version || '' }}
        run: python3 .github/scripts/bump-cli-packages.py --package "$REQUESTED_PACKAGE" --version "$REQUESTED_VERSION"

      - name: Format package
        if: steps.bump.outputs.changed == 'true'
        run: nix run nixpkgs#alejandra -- ${{ steps.bump.outputs.files }}

      - name: Validate packages
        if: steps.bump.outputs.changed == 'true'
        run: nix build --accept-flake-config .#agy .#codex .#cursor-cli

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes after update."
            exit 0
          fi

          git add ${{ steps.bump.outputs.files }}
          git \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(pkgs): bump CLI packages"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Trigger build and cache
        if: steps.bump.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\"}"

      - name: No update needed
        if: steps.bump.outputs.changed == 'false'
        run: echo "${{ steps.bump.outputs.summary }}"
