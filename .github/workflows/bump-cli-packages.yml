name: Bump CLI Packages

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to bump"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - antigravity-cli
          - copilot-cli
          - codex
          - claude-code
          - orcad
          - cursor-cli
          - pi-coding-agent
      version:
        description: "Optional release version for one package"
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: bump-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: inputs.package != 'orcad'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.publish.outputs.revision }}

    steps:
      - name: Checkout repository
        uses: &checkout actions/checkout@v7

      - name: Test package updater
        run: python3 .github/scripts/test_bump_cli_packages.py

      - &install-nix
        name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Bump packages
        id: bump
        uses: nick-fields/retry@v4
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PACKAGE: ${{ inputs.package || 'all' }}
          REQUESTED_VERSION: ${{ inputs.version }}
        with:
          max_attempts: 5
          retry_wait_seconds: 1
          timeout_minutes: 30
          on_retry_command: git restore --source=HEAD --staged --worktree -- .
          command: &bump-command python3 .github/scripts/bump-cli-packages.py --package "$REQUESTED_PACKAGE" --version "$REQUESTED_VERSION"

      - name: Format changed files
        if: steps.bump.outputs.changed == 'true'
        run: nix fmt --accept-flake-config -- ${{ steps.bump.outputs.files }}

      - name: Validate packages
        if: steps.bump.outputs.changed == 'true'
        run: nix build --accept-flake-config .#agy .#copilot .#codex .#claude .#cursor-cli .#pi

      - name: Commit and push
        id: publish
        if: steps.bump.outputs.changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.bump.outputs.files }}
          COMMIT_SUBJECT: ${{ steps.bump.outputs.commit_subject }}
          COMMIT_BODY: ${{ steps.bump.outputs.commit_body }}
        run: &publish |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes after update."
            exit 0
          fi

          read -r -a files <<< "$CHANGED_FILES"
          git add -- "${files[@]}"
          git \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$COMMIT_SUBJECT" -m "$COMMIT_BODY"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  bump-orcad:
    name: Prepare and test Orcad (x86_64)
    needs: bump
    if: >-
      ${{ !cancelled() && (inputs.package == 'orcad' ||
          (inputs.version == '' && (inputs.package == '' || inputs.package == 'all'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      base: ${{ steps.checkout.outputs.commit }}
      pin: ${{ steps.pin.outputs.data }}
      commit_subject: ${{ steps.bump.outputs.commit_subject }}
      commit_body: ${{ steps.bump.outputs.commit_body }}

    steps:
      - uses: *checkout
        id: checkout
        with:
          ref: ${{ github.ref }}
      - *install-nix
      - name: Check for a complete Orcad release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PACKAGE: orcad
          REQUESTED_VERSION: ${{ inputs.version }}
        run: *bump-command
      - name: Build and smoke-test Orcad
        if: steps.bump.outputs.changed == 'true'
        run: &smoke-orcad |
          package=$(nix build --accept-flake-config --no-link --print-out-paths .#orcad)
          ORCAD_PACKAGE="$package" timeout 60s python3 .github/scripts/test_bump_cli_packages.py OrcadRuntimeTests -v
      - name: Export the tested Orcad pin
        id: pin
        if: steps.bump.outputs.changed == 'true'
        run: echo "data=$(base64 -w0 pkgs/orcad.nix)" >> "$GITHUB_OUTPUT"

  publish-orcad:
    name: Test Orcad (ARM64) and publish
    needs: bump-orcad
    if: ${{ !cancelled() && needs.bump-orcad.result == 'success' && needs.bump-orcad.outputs.pin != '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      revision: ${{ steps.publish.outputs.revision }}

    steps:
      - uses: *checkout
        with:
          ref: ${{ needs.bump-orcad.outputs.base }}
      - name: Apply the tested Orcad pin
        env:
          ORCAD_PIN: ${{ needs.bump-orcad.outputs.pin }}
        run: printf '%s' "$ORCAD_PIN" | base64 --decode > pkgs/orcad.nix
      - *install-nix
      - name: Build and smoke-test Orcad
        run: *smoke-orcad
      - name: Commit and push
        id: publish
        env:
          CHANGED_FILES: pkgs/orcad.nix
          COMMIT_SUBJECT: ${{ needs.bump-orcad.outputs.commit_subject }}
          COMMIT_BODY: ${{ needs.bump-orcad.outputs.commit_body }}
        run: *publish

  cache:
    name: Trigger build and cache
    needs: [bump, publish-orcad]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/ci' &&
          (needs.publish-orcad.outputs.revision != '' || needs.bump.outputs.revision != '') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REVISION: ${{ needs.publish-orcad.outputs.revision || needs.bump.outputs.revision }}
    steps:
      - run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f "revision=$REVISION"
