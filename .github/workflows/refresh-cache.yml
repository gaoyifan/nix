name: Refresh Binary Cache

on:
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: refresh-binary-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BUCKET: nix-cache
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

    steps:
      - name: Empty R2 bucket
        run: |
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$R2_ACCOUNT_ID/r2/buckets/$BUCKET/objects?prefix=" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"

      - name: Trigger full build and cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches" \
            --data "{\"ref\":\"main\"}"
