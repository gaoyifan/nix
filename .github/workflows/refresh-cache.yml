name: Refresh Binary Cache

on:
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: refresh-binary-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      # Rebuild every platform, then garbage-collect R2 down to the union of
      # the freshly built closures (handled by build.yml's prune-cache job).
      # We intentionally do NOT empty the bucket first: deleting live objects
      # before the rebuild orphaned .narinfo pointers and forced clients to
      # build from source.
      - name: Trigger full build, cache, and prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches" \
            --data '{"ref":"main","inputs":{"prune":"true"}}'
