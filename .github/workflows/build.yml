name: Build and Cache

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact commit to build; defaults to the dispatched ref"
        required: false
        type: string
      publish-cache:
        description: "Sign and push closures to the R2 binary cache when running on main"
        required: false
        default: true
        type: boolean
      prune:
        description: "After building, delete R2 objects not referenced by the freshly built closures"
        required: false
        default: false
        type: boolean
      allow-large-prune:
        description: "Allow pruning more than 40% of R2 objects"
        required: false
        default: false
        type: boolean

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  BINARY_CACHE_SECRET_KEY: ${{ secrets.BINARY_CACHE_SECRET_KEY }}
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}

jobs:
  build:
    name: Build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            target: homeConfigurations.yifan.config.home.activationPackage
          - os: ubuntu-24.04-arm
            system: aarch64-linux
            target: homeConfigurations.yifan.config.home.activationPackage
          - os: macos-latest
            system: aarch64-darwin
            target: darwinConfigurations.default.system

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting and source lint
        if: matrix.system == 'x86_64-linux'
        run: nix build --accept-flake-config .#checks.${{ matrix.system }}.formatting

      - name: Build configuration
        run: nix build --accept-flake-config .#${{ matrix.target }}

      - name: Build devshell
        run: nix build --accept-flake-config .#devShells.${{ matrix.system }}.default -o result-devshell

      - name: Initialize cache path list
        run: |
          : > cache-store-paths

      - name: Build NixOS host configurations
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          nix build --accept-flake-config --no-link --print-out-paths \
            .#packages.${{ matrix.system }}.nixos-hosts-cache \
            | tee -a cache-store-paths

      - name: Build NixOS disk-writer kexec image
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          nix build --accept-flake-config --no-link --print-out-paths \
            .#packages.${{ matrix.system }}.nixos-disk-writer-kexec \
            | tee -a cache-store-paths

      - name: Build CLI apps
        run: |
          set -euo pipefail

          nix build --accept-flake-config --no-link --print-out-paths \
            .#packages.${{ matrix.system }}.cli-apps-cache \
            | tee -a cache-store-paths

      - name: Build system-manager configurations
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          system_manager_configs=(
            .#systemConfigs.${{ matrix.system }}.default
            .#systemConfigs.${{ matrix.system }}.el2
          )

          nix build --accept-flake-config --no-link --print-out-paths \
            "${system_manager_configs[@]}" \
            | tee -a cache-store-paths

      - name: Switch home-manager configuration
        if: runner.os == 'Linux'
        run: |
          # Validate the same Home Manager switch path used locally. Skip Darwin
          # because `just darwin` is too slow on GitHub-hosted runners.
          nix develop --accept-flake-config .#devShells.${{ matrix.system }}.default -c just home

      - name: Compute R2 candidate paths
        run: |
          set -euo pipefail

          { printf '%s\n' ./result ./result-devshell; cat cache-store-paths; } \
            | xargs nix-store --query --requisites \
            | sort -u > cache-closure-store-paths
          grep -E -- '-(hermes-terminal\.tar\.zst|ggml-large-v3-turbo\.bin)$' \
            cache-closure-store-paths > cache-local-only-store-paths || true

          local_only_count=$(wc -l < cache-local-only-store-paths)
          if [[ "${{ matrix.system }}" == "x86_64-linux" && "$local_only_count" -ne 2 ]]; then
            echo "Expected the terminal image and Whisper model in the local-only list; found $local_only_count:" >&2
            cat cache-local-only-store-paths >&2
            exit 1
          fi

          if [[ -s cache-local-only-store-paths ]]; then
            comm -23 cache-closure-store-paths \
              <(xargs nix-store --query --referrers-closure \
                < cache-local-only-store-paths | sort -u) \
              > cache-r2-candidate-store-paths
          else
            cp cache-closure-store-paths cache-r2-candidate-store-paths
          fi

      - name: Restore official cache query results
        id: official-cache-query
        uses: actions/cache/restore@v5
        with:
          path: cache-nixos-org-query-results
          key: cache-nixos-org-v3-${{ matrix.system }}-bootstrap
          restore-keys: cache-nixos-org-v3-${{ matrix.system }}-

      - name: Compute R2 upload paths
        id: official-cache-update
        run: |
          set -euo pipefail

          now=$(date -u +%s)
          # Columns: store path, HTTP status, expiry epoch (0 means permanent).
          touch cache-nixos-org-query-results
          awk -v now="$now" '
            $2 == 200 || ($2 == 404 && $3 > now) { print $1 }
          ' cache-nixos-org-query-results \
            | sort -u > cache-official-known-store-paths
          comm -23 cache-r2-candidate-store-paths cache-official-known-store-paths \
            > cache-official-unknown-store-paths

          check_official_cache() {
            store_path="$1"
            store_hash="${store_path#/nix/store/}"
            store_hash="${store_hash:0:32}"
            http_code=$(curl --retry 3 --silent --show-error \
              --output /dev/null --write-out '%{http_code}' \
              "https://cache.nixos.org/$store_hash.narinfo")

            case "$http_code" in
              200) printf '%s 200 0\n' "$store_path" ;;
              404) printf '%s 404 %s\n' "$store_path" "$CACHE_404_EXPIRES_AT" ;;
              *)
                echo "Unexpected response from cache.nixos.org for $store_path: HTTP $http_code" >&2
                return 1
                ;;
            esac
          }
          export -f check_official_cache
          export CACHE_404_EXPIRES_AT=$((now + 7 * 24 * 60 * 60))

          : > cache-new-official-query-results
          if [[ -s cache-official-unknown-store-paths ]]; then
            # shellcheck disable=SC2016
            xargs -P 32 -n 1 bash -c 'check_official_cache "$1"' _ \
              < cache-official-unknown-store-paths \
              | sort -k1,1 > cache-new-official-query-results
          fi

          awk -v now="$now" '
            $2 == 200 { status[$1] = 200; expires[$1] = 0 }
            $2 == 404 && $3 > now && status[$1] != 200 && $3 > expires[$1] {
              status[$1] = 404
              expires[$1] = $3
            }
            END { for (path in status) print path, status[path], expires[path] }
          ' cache-nixos-org-query-results cache-new-official-query-results \
            | sort -k1,1 > cache-nixos-org-query-results.tmp
          mv cache-nixos-org-query-results.tmp cache-nixos-org-query-results

          comm -23 cache-r2-candidate-store-paths \
            <(awk '$2 == 200 { print $1 }' cache-nixos-org-query-results) \
            > cache-upload-store-paths

          closure_count=$(wc -l < cache-closure-store-paths)
          candidate_count=$(wc -l < cache-r2-candidate-store-paths)
          query_count=$(wc -l < cache-official-unknown-store-paths)
          upload_count=$(wc -l < cache-upload-store-paths)
          echo "R2 store paths: $upload_count"
          echo "already in cache.nixos.org: $((candidate_count - upload_count))"
          echo "cached query results: $((candidate_count - query_count))"
          echo "official cache queries: $query_count"
          echo "excluded reverse closure: $((closure_count - candidate_count))"

          cache_hash=$(shasum -a 256 cache-nixos-org-query-results | cut -d ' ' -f 1)
          echo "key=cache-nixos-org-v3-${{ matrix.system }}-$cache_hash" >> "$GITHUB_OUTPUT"

      - name: Save official cache query results
        if: steps.official-cache-query.outputs.cache-matched-key != steps.official-cache-update.outputs.key
        uses: actions/cache/save@v5
        with:
          path: cache-nixos-org-query-results
          key: ${{ steps.official-cache-update.outputs.key }}

      - name: Sign R2 upload paths
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs['publish-cache']))
        run: |
          echo "$BINARY_CACHE_SECRET_KEY" > ./secret.key

          if [[ -s cache-upload-store-paths ]]; then
            nix store sign --stdin --key-file ./secret.key < cache-upload-store-paths
          fi

      # Upload the selected paths directly; their omitted references are
      # available from cache.nixos.org.
      - name: Push non-official paths to R2
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs['publish-cache']))
        run: |
          if [[ -s cache-upload-store-paths ]]; then
            nix copy --stdin --no-recursive \
              --to "s3://nix-cache?endpoint=$S3_ENDPOINT&compression=zstd" \
              < cache-upload-store-paths
          else
            echo "All closure paths are already in cache.nixos.org."
          fi

      # Stage the reference-closed candidate set locally, then read the exact
      # narinfo and NAR keys for only the paths selected for R2.
      - name: List cache objects via a local copy
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs['prune']
        run: |
          set -euo pipefail
          lc="$RUNNER_TEMP/localcache"
          rm -rf "$lc"
          mkdir -p "$lc"
          : > "objects-${{ matrix.system }}.txt"
          if [[ -s cache-upload-store-paths ]]; then
            nix copy --stdin --no-recursive \
              --to "file://$lc?compression=zstd" \
              < cache-r2-candidate-store-paths

            sed -E 's#^/nix/store/([^/-]+)-.*#\1.narinfo#' \
              cache-upload-store-paths | sort -u > cache-upload-narinfos
            {
              printf '%s\n' nix-cache-info
              while IFS= read -r narinfo; do
                test -f "$lc/$narinfo"
                nar=$(sed -n 's/^URL: //p' "$lc/$narinfo")
                test -n "$nar"
                test -f "$lc/$nar"
                printf '%s\n%s\n' "$narinfo" "$nar"
              done < cache-upload-narinfos
            } | sort -u > "objects-${{ matrix.system }}.txt"
          fi
          echo "objects: $(wc -l < "objects-${{ matrix.system }}.txt")"

      - name: Upload object key list
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs['prune']
        uses: actions/upload-artifact@v4
        with:
          name: objects-${{ matrix.system }}
          path: objects-${{ matrix.system }}.txt
          retention-days: 1

  # Garbage-collect R2: keep every object referenced by the freshly built
  # closures (across all platforms) and delete only the orphans. This replaces
  # the old "empty the whole bucket then rebuild" strategy, which transiently
  # orphaned live .narinfo pointers and forced clients to build from source.
  prune-cache:
    name: Prune orphaned R2 objects
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs['prune']
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      BUCKET: nix-cache
      LC_ALL: C

    steps:
      - name: Download object key lists
        uses: actions/download-artifact@v4
        with:
          pattern: objects-*
          path: objects
          merge-multiple: true

      - name: Compute keep set
        run: |
          set -euo pipefail
          # Each build job already listed the exact objects it pushed (narinfos,
          # nars and nix-cache-info); the keep set is just their union.
          cat objects/objects-*.txt | sort -u > keep.txt
          test -s keep.txt
          echo "keep objects: $(wc -l < keep.txt)"

      - name: List all R2 objects
        run: |
          set -euo pipefail
          ep="$S3_ENDPOINT"; case "$ep" in http*) ;; *) ep="https://$ep";; esac
          aws s3api list-objects-v2 --endpoint-url "$ep" --bucket "$BUCKET" \
            --query 'Contents[].Key' --output text \
            | tr '\t' '\n' | sed '/^$/d' | sort -u > all-keys.txt
          echo "total R2 objects: $(wc -l < all-keys.txt)"

      - name: Delete orphaned objects
        run: |
          set -euo pipefail
          comm -23 all-keys.txt keep.txt > orphans.txt
          total=$(wc -l < all-keys.txt)
          orphan=$(wc -l < orphans.txt)
          echo "orphans to delete: $orphan / $total"
          # Safety: refuse to delete an implausibly large share of the bucket
          # (e.g. a systematic key-format mismatch between the listing and R2).
          if [ "$total" -gt 0 ] && [ "${{ inputs.allow-large-prune }}" != "true" ] && [ "$((orphan * 100))" -gt "$((total * 40))" ]; then
            echo "Refusing to prune: would delete $orphan of $total objects (>40%)"
            exit 1
          fi
          if [ ! -s orphans.txt ]; then
            echo "Nothing to prune."
            exit 0
          fi
          ep="$S3_ENDPOINT"; case "$ep" in http*) ;; *) ep="https://$ep";; esac
          split -l 1000 orphans.txt orphan-batch-
          for f in orphan-batch-*; do
            jq -Rn '{Objects: [inputs | {Key: .}], Quiet: true}' < "$f" > del.json
            aws s3api delete-objects --endpoint-url "$ep" --bucket "$BUCKET" --delete file://del.json >/dev/null
          done
          echo "Prune complete: removed $(wc -l < orphans.txt) objects."
