name: Bump Orcad

on:
  schedule:
    - cron: "31 0 * * *"
  push:
    branches: [ci]
    paths:
      - .github/workflows/bump-orcad.yml
      - .github/scripts/*orcad.py
      - nixos/optional/orcad.nix
      - pkgs/orcad.nix
  workflow_dispatch:
    inputs:
      version:
        description: "Optional stable Orca version (X.Y.Z)"
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: bump-orcad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.candidate.outputs.base }}
      branch: ${{ steps.candidate.outputs.branch }}
      revision: ${{ steps.candidate.outputs.revision }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Test release selection
        run: python3 .github/scripts/test_bump_orcad.py

      - name: Check for a complete server release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            python3 .github/scripts/bump-orcad.py --version "$REQUESTED_VERSION"
          else
            python3 .github/scripts/bump-orcad.py
          fi

      - name: Push candidate commit
        if: steps.bump.outputs.changed == 'true'
        id: candidate
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git add pkgs/orcad.nix
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(pkgs): bump orcad to $VERSION"
          branch="automation/orcad-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Orcad (${{ matrix.system }})
    needs: prepare
    if: needs.prepare.outputs.revision != '' || github.event_name == 'push'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision || github.sha }}

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Build and test the installed package
        env:
          SYSTEM: ${{ matrix.system }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          package=$(nix build --accept-flake-config --no-link --print-out-paths ".#packages.$SYSTEM.orcad")
          python3 .github/scripts/smoke-orcad.py "$package" "$VERSION"

  promote:
    needs: [prepare, validate]
    if: needs.prepare.outputs.revision != ''
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 2

      - name: Promote the validated commit
        env:
          BASE_REVISION: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail

          current=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [[ "$current" != "$BASE_REVISION" ]]; then
            echo "::error::Target branch advanced during validation. Rerun Bump Orcad against the new base."
            exit 1
          fi
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Trigger build and cache
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "$GITHUB_REF_NAME" -f "revision=$(git rev-parse HEAD)"

  cleanup:
    needs: [prepare, validate, promote]
    if: always() && needs.prepare.outputs.branch != ''
    runs-on: ubuntu-24.04

    steps:
      - name: Delete candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.branch }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$CANDIDATE_BRANCH"
