name: Bump Hermes

on:
  schedule:
    - cron: "47 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: bump-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Bump Hermes
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/bump-hermes.py

      - name: Evaluate related hosts
        if: steps.bump.outputs.changed == 'true'
        run: nix eval .#nixosConfigurations.somo-minisforum.config.system.build.toplevel.drvPath --accept-flake-config >/dev/null

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        env:
          COMMIT_SUBJECT: ${{ steps.bump.outputs.commit_subject }}
          COMMIT_BODY: ${{ steps.bump.outputs.commit_body }}
        run: |
          set -euo pipefail

          git add ${{ steps.bump.outputs.files }}
          git \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$COMMIT_SUBJECT" -m "$COMMIT_BODY"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Trigger build and cache
        if: steps.bump.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"revision\":\"$(git rev-parse HEAD)\"}}"

      - name: No update needed
        if: steps.bump.outputs.changed == 'false'
        run: echo "${{ steps.bump.outputs.summary }}"
