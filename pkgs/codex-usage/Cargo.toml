[package]
name = "codex-usage"
version = "2.0.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = { version = "7.2", default-features = false }
rayon = "1.11"
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
